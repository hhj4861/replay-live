name: Desktop helper packages
on:
  push:
    branches: ['feat/helper-onboarding']
  pull_request:
    paths: ['desktop/**', 'server/local_media.py', 'server/media_runtime.py', 'server/device_import_worker.py', '.github/workflows/helper.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: helper-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ffmpeg --no-progress -y
          # Use the real binaries, not Chocolatey's executable shims. A shim
          # spawns another process and is not a distributable FFmpeg binary.
          $media = Get-ChildItem "$env:ChocolateyInstall/lib/ffmpeg" -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          if (!$media -or !(Test-Path (Join-Path $media.DirectoryName 'ffprobe.exe'))) { throw 'FFmpeg binaries missing' }
          $media.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install locked Python dependencies
        run: python -m pip install -r desktop/requirements-build.txt
      - name: Desktop boundary and media tests
        run: python -m pytest -q tests/test_desktop_helper.py tests/test_local_media.py
      - name: Build and execute frozen media self-test
        run: python desktop/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: helper-${{ matrix.os }}
          path: |
            release-artifacts/helper/*.zip
            release-artifacts/helper/*.sha256
            release-artifacts/helper/*.json
          if-no-files-found: error
          retention-days: 14
