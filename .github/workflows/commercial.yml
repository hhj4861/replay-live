name: Commercial release verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: commercial-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: replay
          POSTGRES_PASSWORD: ci-only-replay-password
          POSTGRES_DB: replay_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U replay -d replay_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      REPLAY_DATABASE_URL: postgresql+psycopg://replay:ci-only-replay-password@127.0.0.1:5432/replay_ci
      REPLAY_RESTORE_DATABASE_URL: postgresql+psycopg://replay:ci-only-replay-password@127.0.0.1:5432/replay_restore
      REPLAY_TEST_POSTGRES_URL: postgresql+psycopg://replay:ci-only-replay-password@127.0.0.1:5432/replay_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install media and PostgreSQL client tools
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg postgresql-client-16
      - name: Install exact Python dependencies
        run: python -m pip install -r requirements.lock && python -m pip check
      - name: Unit and local integration tests
        run: |
          python -c "import os,psycopg; c=psycopg.connect(os.environ['REPLAY_DATABASE_URL'].replace('postgresql+psycopg://','postgresql://'),autocommit=True); c.execute('CREATE DATABASE replay_test'); c.close()"
          python -m pytest -q
      - name: PostgreSQL migration, tenant isolation and concurrent leases
        run: |
          python scripts/commercial-migrate.py
          python scripts/commercial-migrate.py
          python scripts/commercial-verify.py --database-check --seed-fixture
      - name: Backup and isolated restore drill
        run: |
          python -c "import os,psycopg; c=psycopg.connect(os.environ['REPLAY_DATABASE_URL'].replace('postgresql+psycopg://','postgresql://'),autocommit=True); c.execute('CREATE DATABASE replay_restore'); c.close()"
          python scripts/commercial-backup.py /tmp/replay-ci.dump
          python scripts/commercial-restore.py /tmp/replay-ci.dump --confirm-database replay_restore
          python scripts/commercial-verify.py --database-check --database-env REPLAY_RESTORE_DATABASE_URL --assert-restored-fixture
          if python scripts/commercial-restore.py /tmp/replay-ci.dump --confirm-database replay_restore; then exit 1; fi
      - name: Actual sixteen-second database lock recovery
        run: python scripts/commercial-verify.py --sqlite-lock-seconds 16 --report /tmp/replay-lock-report.json
      - name: Web install, lint, types and commercial build
        working-directory: web
        env:
          REPLAY_COMMERCIAL: '1'
          REPLAY_API_URL: https://api.example.invalid
          REPLAY_OIDC_AUTHORITY: https://identity.example.invalid
          REPLAY_OIDC_CLIENT_ID: ci-public-client
          REPLAY_OIDC_AUDIENCE: replay-api
        run: |
          npm ci
          npm run test:client
          npm run lint
          npx tsc --noEmit
          npm run build:vercel
          node --check ../scripts/build-worker-snapshot.mjs
      - name: Audit all installed JavaScript dependency severities
        working-directory: web
        run: npm audit --audit-level=low
      - name: Audit pinned Python dependencies
        run: python -m pip install pip-audit==2.9.0 && python -m pip_audit -r requirements.lock
