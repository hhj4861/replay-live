name: Deploy Replay production
on:
  push:
    branches: [deploy/replay]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: replay-production
  cancel-in-progress: false
jobs:
  commercial:
    if: github.ref == 'refs/heads/deploy/replay' && github.event.created != true
    uses: ./.github/workflows/commercial.yml
  cloudflare:
    if: github.ref == 'refs/heads/deploy/replay' && github.event.created != true
    uses: ./.github/workflows/cloudflare.yml
  deploy:
    if: github.ref == 'refs/heads/deploy/replay' && github.event.created != true
    needs: [commercial, cloudflare]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: https://replay-live-poc.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install pinned deployment tools
        run: |
          npm ci --prefix web --ignore-scripts
          npm install --global vercel@60.1.3
      - name: Build worker, stage API and web, promote and verify
        env:
          REPLAY_FFMPEG_PACKAGE_VERSION: '7:8.0.1-3ubuntu2'
        run: node scripts/deploy-credentials.mjs
      - name: Preserve release and rollback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replay-production-${{ github.sha }}-${{ github.run_attempt }}
          path: release-artifacts/production.json
          if-no-files-found: ignore
          retention-days: 30
